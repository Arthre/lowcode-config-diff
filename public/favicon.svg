<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Diff 合并工具">
  <title>Diff 合并工具</title>
  <!--
    双栏 Merge 工作台的 favicon：圆角瓷片上两份配置 + 中间采纳箭头。
    配色对齐页眉品牌标（accent / accent-muted），随系统亮暗微调明度。
  -->
  <defs>
    <style>
      .tile { fill: #0f766e; }
      .pane { fill: #ccfbf1; }
      .arrow { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        .tile { fill: #134e4a; }
        .pane { fill: #5eead4; }
        .arrow { fill: #ecfdf5; }
      }
    </style>
  </defs>
  <rect class="tile" width="32" height="32" rx="8" />
  <!-- 左参考 / 右结果 -->
  <rect class="pane" x="5" y="7" width="8" height="18" rx="2" />
  <rect class="pane" x="19" y="7" width="8" height="18" rx="2" />
  <!-- 块级采纳：参考 → 结果 -->
  <path class="arrow" d="M13.2 11.15a1.05 1.05 0 0 1 1.48-.12L19.05 15.2a1.2 1.2 0 0 1 0 1.6l-4.37 4.17a1.05 1.05 0 1 1-1.36-1.6L16.7 16l-3.75-3.37a1.05 1.05 0 0 1 .25-1.48z" />
</svg>
